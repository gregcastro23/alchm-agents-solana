<style>
        .grid-bg {
            background-image: 
                linear-gradient(to right, rgba(168, 85, 247, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(168, 85, 247, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center center;
        }
        .glass-panel {
            background: rgba(30, 18, 49, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .input-glow:focus-within {
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.3), 0 0 40px rgba(168, 85, 247, 0.1);
            border-bottom-color: theme('colors.spirit-violet');
        }
    </style>

<body class="bg-obsidian-deep text-on-surface min-h-screen flex flex-col relative overflow-hidden font-body-md text-body-md">
<!-- Background Grid -->
<div class="absolute inset-0 grid-bg pointer-events-none z-0"></div>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center relative z-10 px-margin-mobile md:px-margin-desktop py-12">
<!-- Breadcrumbs -->
<nav aria-label="Breadcrumb" class="mb-12 font-label-mono text-label-mono text-outline flex items-center space-x-2 z-20">
<span class="text-primary font-bold">Vessel</span>
<span class="material-symbols-outlined text-[16px]">chevron_right</span>
<span>Spacetime</span>
<span class="material-symbols-outlined text-[16px]">chevron_right</span>
<span>Engine</span>
<span class="material-symbols-outlined text-[16px]">chevron_right</span>
<span>Knowledge</span>
<span class="material-symbols-outlined text-[16px]">chevron_right</span>
<span>Forge</span>
</nav>
<!-- The Forging Circle (Vessel Naming) -->
<div class="w-full max-w-2xl glass-panel rounded-xl p-8 md:p-12 flex flex-col items-center text-center shadow-2xl relative">
<!-- Ritual Header -->
<div class="mb-8 w-full">
<span class="material-symbols-outlined text-spirit-violet text-4xl mb-4" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
<h1 class="font-headline-xl-mobile md:font-headline-xl text-headline-xl-mobile md:text-headline-xl text-on-background mb-4">Name Your Vessel</h1>
<p class="font-label-mono text-label-mono text-on-surface-variant max-w-lg mx-auto">
                    INITIATE THE BINDING RITUAL. THE TRUE NAME FOCUSES THE ALCHEMICAL WILL AND SETS THE RESONANCE FREQUENCY OF THE AGENT.
                </p>
</div>
<!-- Input Container -->
<div class="w-full max-w-md mx-auto mb-12">
<div class="relative input-glow transition-all duration-300 border-b-2 border-surface-variant group bg-surface-container/50 rounded-t-lg">
<label class="absolute -top-3 left-4 px-1 bg-transparent font-label-mono text-label-mono text-primary/70 group-focus-within:text-spirit-violet transition-colors" for="agent-name">
                        AGENT DESIGNATION
                    </label>
<input autocomplete="off" class="w-full bg-transparent text-center font-headline-lg text-headline-lg text-monica-constant py-6 px-4 border-none focus:ring-0 placeholder-on-surface-variant/30" id="agent-name" placeholder="e.g., Hermes Trismegistus" type="text"/>
</div>
</div>
<!-- Action Area -->
<div class="w-full flex justify-center">
<button class="bg-spirit-violet text-monica-constant font-label-mono text-label-mono uppercase px-8 py-4 rounded-full flex items-center space-x-2 hover:shadow-[0_0_15px_rgba(255,224,131,0.4)] transition-all duration-300">
<span>Initialize Vessel</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</div>
</main>
</body></html>
