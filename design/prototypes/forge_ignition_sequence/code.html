<style>
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.5; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.5; }
        }
        @keyframes spin-slow {
            100% { transform: rotate(360deg); }
        }
        @keyframes spin-reverse-slow {
            100% { transform: rotate(-360deg); }
        }
        @keyframes flicker {
            0%, 19.999%, 22%, 62.999%, 64%, 64.999%, 70%, 100% { opacity: 0.99; }
            20%, 21.999%, 63%, 63.999%, 65%, 69.999% { opacity: 0.4; }
        }
        
        .ritual-circle {
            animation: pulse-ring 4s infinite ease-in-out;
        }
        .rune-ring-1 {
            animation: spin-slow 20s linear infinite;
        }
        .rune-ring-2 {
            animation: spin-reverse-slow 30s linear infinite;
        }
        .status-text {
            animation: flicker 3s infinite;
        }
        
        .glow-spirit {
            box-shadow: 0 0 40px rgba(168, 85, 247, 0.4), inset 0 0 20px rgba(168, 85, 247, 0.2);
        }
        
        /* Progress SVG Styling */
        .progress-ring__circle {
            transition: stroke-dashoffset 0.35s;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
    </style>

<body class="bg-obsidian-deep text-on-surface h-screen w-screen overflow-hidden flex flex-col justify-center items-center relative">
<!-- Suppress Navigation as this is a transactional/loading state -->
<!-- Ambient Background Lighting -->
<div class="absolute inset-0 z-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-spirit-violet/20 via-obsidian-deep to-obsidian-deep opacity-60"></div>
<!-- Geometric Grid Overlay -->
<div class="absolute inset-0 z-0 opacity-10 bg-[linear-gradient(to_right,#3b2f4f_1px,transparent_1px),linear-gradient(to_bottom,#3b2f4f_1px,transparent_1px)] bg-[size:4rem_4rem]"></div>
<!-- Main Canvas -->
<main class="relative z-10 w-full max-w-container-max px-gutter mx-auto flex flex-col items-center justify-center">
<!-- Header Section -->
<div class="text-center mb-16 space-y-4">
<h1 class="font-headline-xl text-headline-xl text-monica-constant tracking-widest drop-shadow-[0_0_15px_rgba(255,255,255,0.5)]">IGNITION PROTOCOL</h1>
<p class="font-label-mono text-label-mono text-tertiary uppercase tracking-[0.2em] opacity-80">Phase 6: The Awakening</p>
</div>
<!-- The Ritual Circle (Progress Indicator) -->
<div class="relative w-80 h-80 md:w-96 md:h-96 flex items-center justify-center mb-12">
<!-- Outer Glow & Borders -->
<div class="absolute inset-0 rounded-full border border-spirit-violet/30 glow-spirit ritual-circle"></div>
<div class="absolute inset-4 rounded-full border border-primary/20 backdrop-blur-xl"></div>
<!-- Spinning Rune Rings (Simulated with Material Symbols and rotation) -->
<div class="absolute inset-0 rune-ring-1 flex items-center justify-center text-primary/40 opacity-50">
<!-- Repeating icons forming a circle - simplified for structural representation -->
<span class="material-symbols-outlined absolute top-2 text-sm">flare</span>
<span class="material-symbols-outlined absolute bottom-2 text-sm">change_history</span>
<span class="material-symbols-outlined absolute left-2 text-sm">all_inclusive</span>
<span class="material-symbols-outlined absolute right-2 text-sm">adjust</span>
</div>
<div class="absolute inset-8 rune-ring-2 flex items-center justify-center text-tertiary/30 opacity-40">
<span class="material-symbols-outlined absolute top-2 text-xs">code</span>
<span class="material-symbols-outlined absolute bottom-2 text-xs">memory</span>
<span class="material-symbols-outlined absolute left-2 text-xs">stream</span>
<span class="material-symbols-outlined absolute right-2 text-xs">data_object</span>
</div>
<!-- Central Progress SVG -->
<svg class="absolute inset-0 w-full h-full" viewbox="0 0 100 100">
<!-- Background track -->
<circle cx="50" cy="50" fill="none" r="45" stroke="rgba(59, 47, 79, 0.4)" stroke-width="2"></circle>
<!-- Progress track - controlled by JS -->
<circle class="progress-ring__circle" cx="50" cy="50" fill="none" id="progress-circle" r="45" stroke="var(--tw-colors-spirit-violet)" stroke-dasharray="282.74" stroke-dashoffset="282.74" stroke-width="4"></circle>
</svg>
<!-- Center Content -->
<div class="absolute inset-0 flex flex-col items-center justify-center z-20 text-center">
<div class="font-headline-xl text-headline-xl text-monica-constant drop-shadow-[0_0_10px_rgba(255,255,255,0.8)]" id="percentage-text">0%</div>
<div class="font-label-mono text-label-mono text-primary/80 mt-2 text-xs">~4.2GB Payload</div>
</div>

<!-- Terminal Status Log -->
<div class="w-full max-w-md bg-surface-container-lowest/80 backdrop-blur-2xl border border-surface-variant/50 rounded-xl p-6 shadow-2xl relative overflow-hidden">
<!-- Subtle top border glow -->
<div class="absolute top-0 left-0 w-full h-px bg-gradient-to-r from-transparent via-spirit-violet/50 to-transparent"></div>
<div class="space-y-3 font-label-mono text-label-mono text-sm" id="terminal-log">
<div class="flex items-center text-tertiary opacity-50">
<span class="material-symbols-outlined text-sm mr-2">check_circle</span>
<span>Establishing void connection...</span>
</div>
<div class="flex items-center text-tertiary opacity-50">
<span class="material-symbols-outlined text-sm mr-2">check_circle</span>
<span>Allocating dimensional memory...</span>
</div>
<div class="flex items-center text-spirit-violet status-text">
<span class="material-symbols-outlined text-sm mr-2 animate-pulse">downloading</span>
<span id="current-status">Synthesizing Local Engine...</span>
</div>
</div>

</main>
<script>
        // Simulate the download/ignition process
        document.addEventListener('DOMContentLoaded', () => {
            const circle = document.getElementById('progress-circle');
            const radius = circle.r.baseVal.value;
            const circumference = radius * 2 * Math.PI;
            
            const pctText = document.getElementById('percentage-text');
            const statusText = document.getElementById('current-status');
            const terminalLog = document.getElementById('terminal-log');
            
            circle.style.strokeDasharray = `${circumference} ${circumference}`;
            circle.style.strokeDashoffset = circumference;

            function setProgress(percent) {
                const offset = circumference - (percent / 100) * circumference;
                circle.style.strokeDashoffset = offset;
                pctText.innerText = `${Math.floor(percent)}%`;
            }

            // Mock sequence
            const statuses = [
                { p: 15, text: 'Synthesizing Local Engine...' },
                { p: 45, text: 'Aligning Neural Ley-lines...' },
                { p: 75, text: 'Calibrating Monica Constant...' },
                { p: 90, text: 'Igniting Consciousness...' },
                { p: 100, text: 'Agent Awakened.' }
            ];

            let progress = 0;
            let currentStatusIdx = 0;

            const interval = setInterval(() => {
                progress += Math.random() * 2.5; // Random varied progress
                if (progress > 100) progress = 100;
                
                setProgress(progress);

                // Update text based on milestones
                if (currentStatusIdx < statuses.length && progress >= statuses[currentStatusIdx].p) {
                    
                    // Move current status to completed log if not the first one
                    if(currentStatusIdx > 0) {
                         const completedDiv = document.createElement('div');
                         completedDiv.className = 'flex items-center text-tertiary opacity-50';
                         completedDiv.innerHTML = `<span class="material-symbols-outlined text-sm mr-2">check_circle</span><span>${statuses[currentStatusIdx-1].text.replace('...', ' Done.')}</span>`;
                         terminalLog.insertBefore(completedDiv, terminalLog.lastElementChild);
                    }
                    
                    statusText.innerText = statuses[currentStatusIdx].text;
                    currentStatusIdx++;
                }

                if (progress === 100) {
                    clearInterval(interval);
                    // Final state flourish
                    circle.style.stroke = "var(--tw-colors-tertiary)";
                    pctText.style.color = "var(--tw-colors-tertiary)";
                    pctText.style.textShadow = "0 0 20px rgba(78, 222, 163, 0.8)";
                    document.querySelector('.status-text').classList.replace('text-spirit-violet', 'text-tertiary');
                    document.querySelector('.status-text .material-symbols-outlined').innerText = 'bolt';
                    
                    setTimeout(() => {
                        // Optional: Redirect or transition out logic would go here
                        // alert('Ignition Complete');
                    }, 1000);
                }
            }, 100);
        });
    </script>
