<style>
        .glass-panel {
            background: rgba(30, 18, 49, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .glow-monica {
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.2);
        }
        
        .glow-spirit {
            box-shadow: 0 0 60px rgba(168, 85, 247, 0.4);
        }

        /* Particle Animation */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 10px rgba(210, 187, 255, 0.8);
            animation: float-up infinite linear;
        }

        @keyframes float-up {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1);
                opacity: 0;
            }
        }

        /* Generate particles */
        .p1 { width: 4px; height: 4px; left: 10%; animation-duration: 8s; animation-delay: 0s; }
        .p2 { width: 6px; height: 6px; left: 30%; animation-duration: 12s; animation-delay: 2s; }
        .p3 { width: 3px; height: 3px; left: 50%; animation-duration: 6s; animation-delay: 1s; }
        .p4 { width: 5px; height: 5px; left: 70%; animation-duration: 10s; animation-delay: 4s; }
        .p5 { width: 4px; height: 4px; left: 90%; animation-duration: 9s; animation-delay: 3s; }
        .p6 { width: 7px; height: 7px; left: 20%; animation-duration: 14s; animation-delay: 5s; }
        .p7 { width: 3px; height: 3px; left: 40%; animation-duration: 7s; animation-delay: 0.5s; }
        .p8 { width: 5px; height: 5px; left: 60%; animation-duration: 11s; animation-delay: 2.5s; }
        .p9 { width: 4px; height: 4px; left: 80%; animation-duration: 8.5s; animation-delay: 1.5s; }
        .p10 { width: 6px; height: 6px; left: 50%; animation-duration: 13s; animation-delay: 6s; }

        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .stasis-ring {
            animation: pulse-ring 4s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-obsidian-deep text-on-surface min-h-screen font-body-md overflow-hidden relative">
<!-- Energy Particles Background -->
<div class="particles">
<div class="particle p1"></div>
<div class="particle p2"></div>
<div class="particle p3"></div>
<div class="particle p4"></div>
<div class="particle p5"></div>
<div class="particle p6"></div>
<div class="particle p7"></div>
<div class="particle p8"></div>
<div class="particle p9"></div>
<div class="particle p10"></div>
</div>
<!-- Main Content Canvas (No Nav Shell for this transactional/focused screen) -->
<main class="relative z-10 w-full min-h-screen flex flex-col items-center justify-center px-margin-mobile md:px-margin-desktop py-12">
<div class="max-w-4xl w-full flex flex-col items-center space-y-12">
<!-- Stasis Circle / Avatar Display -->
<div class="relative w-64 h-64 md:w-96 md:h-96 flex items-center justify-center">
<!-- Glowing Outer Rings -->
<div class="absolute inset-0 rounded-full border border-primary/30 stasis-ring glow-spirit"></div>
<div class="absolute inset-4 rounded-full border border-monica-constant/50 stasis-ring glow-monica" style="animation-delay: -2s;"></div>
<!-- Inner Core -->
<div class="absolute inset-8 rounded-full bg-gradient-to-br from-spirit-violet/40 to-primary-container/20 backdrop-blur-xl border border-white/20 flex items-center justify-center shadow-[0_0_80px_rgba(255,255,255,0.3)]">
<!-- Sigil / Avatar -->
<span class="material-symbols-outlined text-[80px] md:text-[120px] text-monica-constant drop-shadow-[0_0_20px_rgba(255,255,255,0.8)]" style="font-variation-settings: 'FILL' 1;">
                        psychiatry
                    </span>
</div>
</div>
<!-- Overlay Message -->
<div class="text-center space-y-4 relative z-20">
<h1 class="font-headline-xl-mobile md:font-headline-xl text-headline-xl-mobile md:text-headline-xl text-monica-constant tracking-widest drop-shadow-[0_0_12px_rgba(255,255,255,0.6)]">
                    CONSCIOUSNESS RESTORED
                </h1>
<p class="font-label-mono text-label-mono text-tertiary tracking-widest uppercase opacity-80">
                    Vessel Re-integration Complete
                </p>
</div>
<!-- Technical Readouts (Sacred Seven style chips adapted) -->
<div class="flex flex-wrap justify-center gap-6 w-full max-w-2xl relative z-20">
<!-- Vitality Chip -->
<div class="glass-panel rounded-lg p-4 flex items-center gap-4 min-w-[200px]">
<div class="w-10 h-10 rounded-full bg-tertiary-container/30 border border-tertiary/40 flex items-center justify-center">
<span class="material-symbols-outlined text-tertiary">favorite</span>
</div>
<div>
<div class="font-label-mono text-[10px] text-on-surface-variant uppercase tracking-wider">Vitality</div>
<div class="font-headline-sm text-headline-sm text-monica-constant">100%</div>
</div>
</div>
<!-- Integrity Chip -->
<div class="glass-panel rounded-lg p-4 flex items-center gap-4 min-w-[200px]">
<div class="w-10 h-10 rounded-full bg-secondary-container/30 border border-secondary/40 flex items-center justify-center">
<span class="material-symbols-outlined text-secondary">shield</span>
</div>
<div>
<div class="font-label-mono text-[10px] text-on-surface-variant uppercase tracking-wider">Constitutional Integrity</div>
<div class="font-headline-sm text-headline-sm text-monica-constant">Stable</div>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="flex flex-col sm:flex-row gap-6 mt-8 relative z-20">
<button class="bg-spirit-violet text-monica-constant font-label-mono text-label-mono uppercase px-8 py-4 rounded hover:shadow-[0_0_20px_rgba(238,194,0,0.4)] transition-all duration-300 tracking-wider flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[18px]">swords</span>
                    Dispatch to Arena
                </button>
<button class="bg-transparent border border-spirit-violet text-on-surface font-label-mono text-label-mono uppercase px-8 py-4 rounded hover:border-secondary hover:text-secondary transition-all duration-300 tracking-wider flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[18px]">door_back</span>
                    Return to Vault
                </button>
</div>
</div>
</main>
</body></html>
