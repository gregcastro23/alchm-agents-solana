    <script>
      document.addEventListener('DOMContentLoaded', async function () {
        const loading = document.getElementById('__bundler_loading')
        function setStatus(msg) {
          if (loading) loading.textContent = msg
        }

        // Error sink persists across replaceWith since it's on window, not the DOM.
        window.addEventListener(
          'error',
          function (e) {
            var p = document.body || document.documentElement
            var d =
              document.getElementById('__bundler_err') ||
              p.appendChild(document.createElement('div'))
            d.id = '__bundler_err'
            d.style.cssText =
              'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto'
            d.textContent =
              (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
              '[bundle] ' +
              (e.message || e.type) +
              (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '')
          },
          true
        )

        try {
          const manifestEl = document.querySelector('script[type="__bundler/manifest"]')
          const templateEl = document.querySelector('script[type="__bundler/template"]')
          if (!manifestEl || !templateEl) {
            setStatus('Error: missing bundle data')
            console.error(
              '[bundler] Missing script tags — manifestEl:',
              !!manifestEl,
              'templateEl:',
              !!templateEl
            )
            return
          }

          const manifest = JSON.parse(manifestEl.textContent)
          let template = JSON.parse(templateEl.textContent)

          const uuids = Object.keys(manifest)
          setStatus('Unpacking ' + uuids.length + ' assets...')

          const blobUrls = {}
          await Promise.all(
            uuids.map(async uuid => {
              const entry = manifest[uuid]
              try {
                const binaryStr = atob(entry.data)
                const bytes = new Uint8Array(binaryStr.length)
                for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i)

                let finalBytes = bytes
                if (entry.compressed) {
                  if (typeof DecompressionStream !== 'undefined') {
                    const ds = new DecompressionStream('gzip')
                    const writer = ds.writable.getWriter()
                    const reader = ds.readable.getReader()
                    writer.write(bytes)
                    writer.close()
                    const chunks = []
                    let totalLen = 0
                    while (true) {
                      const { done, value } = await reader.read()
                      if (done) break
                      chunks.push(value)
                      totalLen += value.length
                    }
                    finalBytes = new Uint8Array(totalLen)
                    let offset = 0
                    for (const chunk of chunks) {
                      finalBytes.set(chunk, offset)
                      offset += chunk.length
                    }
                  } else {
                    console.warn(
                      'DecompressionStream not available, asset ' + uuid + ' may not render'
                    )
                  }
                }

                blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }))
              } catch (err) {
                console.error('Failed to decode asset ' + uuid + ':', err)
                blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }))
              }
            })
          )

          const extResEl = document.querySelector('script[type="__bundler/ext_resources"]')
          const extResources = extResEl ? JSON.parse(extResEl.textContent) : []
          const resourceMap = {}
          for (const entry of extResources) {
            if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid]
          }

          setStatus('Rendering...')
          for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid])

          // Strip integrity + crossorigin — blob URLs from a file:// document inherit
          // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
          // The manifest bytes are ours; SRI protects against CDN compromise, not this.
          template = template
            .replace(/\s+integrity="[^"]*"/gi, '')
            .replace(/\s+crossorigin="[^"]*"/gi, '')

          const resourceScript =
            '<script>window.__resources = ' +
            JSON.stringify(resourceMap)
              .split('</' + 'script>')
              .join('<\\/' + 'script>') +
            ';</' +
            'script>'
          // Inject after <head> so the DOCTYPE stays first; prepending the script
          // would push the parser into quirks mode. DOMParser always emits a <head>
          // (synthesizing one if the source HTML omitted it) but may carry
          // attributes through, so match the full opening tag. slice() rather than
          // replace() keeps us clear of $-pattern substitution in resourceScript.
          const headOpen = template.match(/<head[^>]*>/i)
          if (headOpen) {
            const i = headOpen.index + headOpen[0].length
            template = template.slice(0, i) + resourceScript + template.slice(i)
          }

          // Parse the template and swap the root element. Scripts inserted via
          // DOMParser/replaceWith are inert per spec — re-create each with
          // createElement so they execute, awaiting onload for src scripts to
          // preserve ordering (React before ReactDOM before Babel before text/babel).
          const doc = new DOMParser().parseFromString(template, 'text/html')
          document.documentElement.replaceWith(doc.documentElement)
          const dead = Array.from(document.scripts)
          for (const old of dead) {
            const s = document.createElement('script')
            for (const a of old.attributes) s.setAttribute(a.name, a.value)
            s.textContent = old.textContent
            // text/babel scripts with a src: fetch and inline. transformScriptTags
            // does XHR against the src, but blob:null/ from a file:// origin is
            // silently dropped. Inlining makes it a plain inline babel script,
            // which transformScriptTags handles unconditionally.
            if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
              const r = await fetch(s.src)
              s.textContent = await r.text()
              s.removeAttribute('src')
            }
            const p = s.src
              ? new Promise(function (r) {
                  s.onload = s.onerror = r
                })
              : null
            old.replaceWith(s)
            if (p) await p
          }
          // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
          // which fired before we swapped the document. Trigger manually if present.
          if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
            window.Babel.transformScriptTags()
          }
        } catch (err) {
          setStatus('Error unpacking: ' + err.message)
          console.error('Bundle unpack error:', err)
        }
      })
    </script>

      "<!DOCTYPE html>\n<html lang=\"en\" class=\"dark\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Alchm · Design System<\u002Ftitle>\n<style>/* ════════════════════════════════════════════════════════════════════════\n   ALCHM · UNIFIED TOKEN LAYER  —  drop-in for app/globals.css @layer base\n   ────────────────────────────────────────────────────────────────────────\n   Dark-first single source of truth. Every shadcn/Tailwind token is defined\n   on :root with the cosmic dark values, AND mirrored on .dark.\n\n   WHY ON :root:  the production bug is that `.dark` is never applied, so the\n   app falls back to the light token set on dark pages. By defining the dark\n   values on :root, the correct theme renders even before next-themes mounts —\n   the bug cannot recur. Mounting <html class=\"dark\"> (Phase 1) then keeps\n   shadcn's `dark:` variant utilities working as authored.\n\n   Tailwind maps these via hsl(var(--token)) in tailwind.config.ts. Keep that.\n   ════════════════════════════════════════════════════════════════════════ */\n\n:root,\n.dark {\n  /* ── shadcn semantic tokens (HSL channels, consumed as hsl(var(--x))) ── */\n  --background:            249 56% 4%;     /* deep space  #050410 */\n  --foreground:            40 25% 92%;     /* warm ink    #f2ede6 */\n\n  --card:                  249 44% 9%;     /* raised surface */\n  --card-foreground:       40 20% 91%;\n  --popover:               249 48% 8%;\n  --popover-foreground:    40 20% 91%;\n\n  --primary:               263 70% 58%;    /* violet brand fill */\n  --primary-foreground:    0 0% 100%;\n  --secondary:             249 40% 14%;\n  --secondary-foreground:  40 18% 90%;\n  --accent:                258 89% 76%;    /* aurora violet #a78bfa */\n  --accent-foreground:     249 56% 6%;\n  --muted:                 249 26% 16%;\n  --muted-foreground:      268 9% 62%;     /* #8d8595 */\n\n  --destructive:           2 78% 62%;\n  --destructive-foreground:0 0% 100%;\n  --success:               145 46% 52%;\n  --success-foreground:    145 60% 8%;\n  --warning:               38 84% 64%;\n  --warning-foreground:    38 70% 8%;\n\n  --border:                255 30% 22%;    /* solid border base */\n  --input:                 249 30% 15%;    /* input FILL — never transparent */\n  --ring:                  258 89% 76%;\n\n  --radius:                0.625rem;\n\n  /* sidebar (kept from existing system, re-derived dark) */\n  --sidebar-background:    249 46% 7%;\n  --sidebar-foreground:    40 18% 90%;\n  --sidebar-primary:       263 70% 58%;\n  --sidebar-primary-foreground: 0 0% 100%;\n  --sidebar-accent:        249 40% 13%;\n  --sidebar-accent-foreground:  40 18% 90%;\n  --sidebar-border:        255 28% 20%;\n  --sidebar-ring:          258 89% 76%;\n\n  /* ── Raw cosmic palette (for bespoke effects: starfields, nebula, chart) ── */\n  --bg-deep:   #050410;\n  --bg-base:   #0a0918;\n  --bg-1:      #11102a;\n  --bg-2:      #18173a;\n\n  --gold:      #e9b86f;\n  --gold-hi:   #f5d195;\n  --violet:    #a78bfa;\n  --violet-hi: #c4b5fd;\n  --rose:      #f4a8c8;\n\n  /* glow/translucent variants of border + accent (the look the old blanket\n     overrides faked — now explicit, opt-in via .surface / .glass) */\n  --border-glow: 263 70% 58%;\n  --hairline:    rgba(196, 181, 253, 0.10);\n\n  /* ── Elemental system (first-class) ──────────────────────────────────── */\n  --fire:   #ef5d4e;\n  --water:  #5e9bd6;\n  --earth:  #8aa56a;\n  --air:    #d9c87a;\n  --fire-soft:  rgba(239, 93, 78, 0.14);\n  --water-soft: rgba(94, 155, 214, 0.14);\n  --earth-soft: rgba(138, 165, 106, 0.14);\n  --air-soft:   rgba(217, 200, 122, 0.14);\n\n  /* ── Aurora / nebula accent gradients ────────────────────────────────── */\n  --aurora: linear-gradient(125deg, #7c5cf0 0%, #a78bfa 38%, #f4a8c8 72%, #e9b86f 100%);\n  --aurora-soft: linear-gradient(125deg, rgba(124,92,240,0.22), rgba(244,168,200,0.16) 60%, rgba(233,184,111,0.14));\n  --nebula: radial-gradient(120% 120% at 12% 8%, rgba(124,92,192,0.20), transparent 55%),\n            radial-gradient(120% 120% at 88% 92%, rgba(80,60,160,0.18), transparent 60%),\n            radial-gradient(90% 90% at 60% 30%, rgba(244,168,200,0.06), transparent 55%);\n\n  /* ── Typography ──────────────────────────────────────────────────────── */\n  --ff-display: \"Cormorant Garamond\", \"Iowan Old Style\", Georgia, serif;\n  --ff-ui:      \"Manrope\", \"DM Sans\", -apple-system, system-ui, sans-serif;\n  --ff-mono:    \"IBM Plex Mono\", \"JetBrains Mono\", ui-monospace, monospace;\n\n  /* fluid type scale — clamp(min, vw-fluid, max) */\n  --text-xs:   0.75rem;\n  --text-sm:   0.8125rem;\n  --text-base: 0.9375rem;\n  --text-md:   1.0625rem;\n  --text-lg:   clamp(1.125rem, 0.9rem + 0.6vw, 1.375rem);\n  --text-xl:   clamp(1.5rem, 1.1rem + 1.2vw, 2.125rem);\n  --text-2xl:  clamp(2rem, 1.4rem + 2.4vw, 3.25rem);\n  --text-3xl:  clamp(2.75rem, 1.8rem + 4vw, 4.75rem);\n\n  /* ── Spacing scale (4px base) ────────────────────────────────────────── */\n  --space-1: 4px;   --space-2: 8px;   --space-3: 12px;  --space-4: 16px;\n  --space-5: 24px;  --space-6: 32px;  --space-7: 48px;  --space-8: 64px;\n\n  /* ── Radius scale ────────────────────────────────────────────────────── */\n  --r-xs: 6px;  --r-sm: 8px;  --r-md: 10px;  --r-lg: 14px;  --r-xl: 20px;  --r-pill: 999px;\n\n  /* ── Elevation scale (layered, dark-tuned) ───────────────────────────── */\n  --e-1: 0 1px 0 0 rgba(196,181,253,0.06), 0 1px 2px rgba(5,4,16,0.6);\n  --e-2: 0 0 0 1px hsl(var(--border) / 0.6), 0 8px 24px rgba(5,4,16,0.5);\n  --e-3: 0 0 0 1px hsl(var(--border) / 0.7), 0 16px 44px rgba(5,4,16,0.62);\n  --e-glow:   0 0 0 1px hsl(var(--border-glow) / 0.4), 0 12px 40px rgba(124,92,240,0.18);\n  --e-active: 0 0 0 1px var(--border-gold, rgba(245,181,66,0.42)), 0 16px 48px rgba(245,181,66,0.16);\n\n  /* ── Motion ──────────────────────────────────────────────────────────── */\n  --ease: cubic-bezier(0.22, 0.61, 0. ─── */\n.scale-row { display: flex; align-items: center; gap: 14px; padding: 7px 0; }\n.scale-row .lbl { font-family: var(--ff-mono); font-size: 11px; width: 90px; color: hsl(var(--muted-foreground)); }\n.scale-row .bar { height: 14px; border-radius: 4px; background: var(--aurora-soft); border: 1px solid hsl(var(--border)); }\n.radii { display: flex; gap: 14px; flex-wrap: wrap; }\n.radii .r { width: 84px; height: 64px; background: hsl(var(--secondary)); border: 1px solid hsl(var(--border)); display: grid; place-items: end center; padding-bottom: 6px; font-family: var(--ff-mono); font-size: 10px; color: hsl(var(--muted-foreground)); }\n.elev { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }\n.elev .e { height: 78px; border-radius: var(--r-md); background: hsl(var(--card)); display: grid; place-items: center; font-family: var(--ff-mono); font-size: 11px; color: hsl(var(--muted-foreground)); }\n\n/* ── Components ───────────────────────────────────────────────────────── */\n.btn { font-family: var(--ff-ui); font-weight: 600; font-size: var(--text-sm); padding: 9px 16px; border-radius: var(--r-sm); border: 1px solid transparent; cursor: pointer; transition: all var(--dur-2) var(--ease); display: inline-flex; align-items: center; gap: 8px; }\n.btn-primary { background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); }\n.btn-primary:hover { background: hsl(var(--primary) / 0.88); box-shadow: var(--e-glow); }\n.btn-aurora { background: var(--aurora); color: #0c0319; }\n.btn-aurora:hover { filter: brightness(1.08); box-shadow: var(--e-glow); }\n.btn-secondary { background: hsl(var(--secondary)); color: hsl(var(--secondary-foreground)); border-color: hsl(var(--border)); }\n.btn-secondary:hover { background: hsl(var(--secondary) / 0.7); }\n.btn-outline { background: transparent; color: hsl(var(--foreground)); border-color: hsl(var(--border-glow) / 0.5); }\n.btn-outline:hover { background: hsl(var(--accent) / 0.12); border-color: hsl(var(--ring)); }\n.btn-ghost { background: transparent; color: hsl(var(--muted-foreground)); }\n.btn-ghost:hover { background: hsl(var(--secondary) / 0.6); color: hsl(var(--foreground)); }\n.btn-destructive { background: hsl(var(--destructive)); color: hsl(var(--destructive-foreground)); }\n.btnrow { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }\n\n.surfaces-demo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; border-radius: var(--r-lg); overflow: hidden; border: 1px solid hsl(var(--border)); }\n.surfaces-demo .s { padding: 22px 18px; }\n.surfaces-demo .s.s-bg { background: hsl(var(--background)); }\n.surfaces-demo .s.s-card { background: hsl(var(--card)); }\n.surfaces-demo .s.s-pop { background: hsl(var(--popover)); }\n.surfaces-demo .s .t { font-family: var(--ff-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: hsl(var(--muted-foreground)); margin-bottom: 12px; }\n\n.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }\n.field label { font-size: var(--text-sm); font-weight: 600; color: hsl(var(--foreground) / 0.9); }\n.input {\n  background: hsl(var(--input)); /* FILLED — never transparent */\n  border: 1px solid hsl(var(--border)); border-radius: var(--r-sm);\n  padding: 9px 12px; color: hsl(var(--foreground)); font-family: var(--ff-ui); font-size: var(--text-sm);\n  transition: border-color var(--dur-2) var(--ease), box-shadow var(--dur-2) var(--ease);\n}\n.input::placeholder { color: hsl(var(--muted-foreground) / 0.7); }\n.input:focus { outline: none; border-color: hsl(var(--ring)); box-shadow: 0 0 0 3px hsl(var(--ring) / 0.22); }\n\n.badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: var(--r-pill); font-family: var(--ff-mono); font-size: 11px; font-weight: 500; }\n.badge-default { background: hsl(var(--secondary)); color: hsl(var(--secondary-foreground)); border: 1px solid hsl(var(--border)); }\n.badge-success { background: hsl(var(--success) / 0.16); color: hsl(var(--success)); }\n.badge-warning { background: hsl(var(--warning) / 0.16); color: hsl(var(--warning)); }\n.badge-danger  { background: hsl(var(--destructive) / 0.16); color: hsl(var(--destructive)); }\n\n/* ── Before / after ───────────────────────────────────────────────────── */\n.ba { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }\n.ba-col .ba-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }\n.ba-col .ba-head .t { font-weight: 700; font-size: var(--text-sm); }\n.ba-col .ba-head .tag { font-family: var(--ff-mono); font-size: 10px; padding: 2px 8px; border-radius: 4px; }\n.ba-before .tag { background: rgba(239,93,78,0.18); color: var(--fire); }\n.ba-after .tag { background: rgba(138,165,106,0.18); color: var(--earth); }\n.viewport { border-radius: var(--r-lg); overflow: hidden; border: 1px solid hsl(var(--border)); height: 340px; position: relative; }\n.viewport .bar { height: 30px; display: flex; align-items: center; gap: 6px; padding: 0 12px; border-bottom: 1px solid rgba(255,255,255,0.06); }\n.viewport .bar i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }\n.viewport .stage { padding: 18px; height: calc(100% - 30px); overflow: hidden; }\n\n/* The BUG simulation: light shadcn tokens applied to a dark-intent page.\n   This is exactly what ships today when .dark is never added. */\n.sim-light {\n  --bg: 0 0% 100%; --fg: 0 0% 3.9%; --card-c: 0 0% 100%; --muted-c: 0 0% 45%;\n  --brd: 0 0% 89.8%; --pri: 0 0% 9%;\n}\n.sim-light .bar { background: hsl(var(--card-c)); }\n.sim-light .stage { background: hsl(var(--bg)); }\n/* dark page intent (gradient bg) but light card tokens → white-on-white */\n.sim-light .page-dark { background: linear-gradient(135deg,#0c0319,#1e0a3c); padding: 16px; border-radius: 10px; height: 100%; }\n.sim-light .mockcard { background: hsl(var(--card-c)); color: hsl(var(--fg)); border: 1px solid hsl(var(--brd)); border-radius: 10px; padding: 14px; }\n.sim-light .mockcard .muted { color: hsl(var(--muted-c)); }\n.sim-light .ghost-text { color: #fff; } /* invisible-on-white symptom */\n.sim-light .mock-btn-outline { background:#fff; color:#fff; border:1px solid #e5e5e5; } /* invisible label */\n.sim-light .mock-input { background:#fff; border:1px solid #e5e5e5; color:#111; }\n\n.sim-dark { --bg: var(--background); }\n.sim-dark .bar { background: hsl(var(--card)); }\n.sim-dark .stage { background: hsl(var(--background)); }\n\n.mini { font-size: 12px; }\n.mini .mt { font-family: var(--ff-display); font-size: 19px; margin: 0 0 6px; }\n.mini .mp { margin: 0 0 10px; line-height: 1.5; }\n.mockcard { padding: 14px; border-radius: 10px; margin-bottom: 10px; }\n.mock-row { display: flex; gap: 8px; flex-wrap: wrap; }\n.note { font-family: var(--ff-mono); font-size: 10.5px; color: hsl(var(--muted-foreground)); margin-top: 10px; display: flex; gap: 8px; align-items: flex-start; }\n.note::before { content: \"▸\"; color: hsl(var(--accent)); }\n\n.tabs { display: flex; gap: 6px; margin: 18px 0 16px; flex-wrap: wrap; }\n.tab { font-family: var(--ff-mono); font-size: 11px; letter-spacing: 0.06em; padding: 7px 13px; border-radius: var(--r-pill); border: 1px solid hsl(var(--border)); background: hsl(var(--card) / 0.4); color: hsl(var(--muted-foreground)); cursor: pointer; transition: all var(--dur-2) var(--ease); }\n.tab:hover { color: hsl(var(--foreground)); }\n.tab.on { background: var(--aurora); color: #0c0319; border-color: transparent; font-weight: 600; }\n\n.changelog { display: grid; gap: 10px; }\n.cl { display: grid; grid-template-columns: 92px 1fr; gap: 16px; padding: 13px 16px; border-radius: var(--r-md); background: hsl(var(--card) / 0.4); border: 1px solid hsl(var(--border) / 0.5); }\n.cl .ph { font-family: var(--ff-mono); font-size: 10px; letter-spacing: 0.1em; color: hsl(var(--accent)); text-transform: uppercase; }\n.cl .what { font-size: var(--text-sm); color: hsl(var(--foreground) / 0.9); }\n.cl .what b { font-weight: 700; }\n\n.foot { padding: 40px 44px 80px; color: hsl(var(--muted-foreground)); font-family: var(--ff-mono); font-size: 11px; }\n\n@media (max-width: 920px) {\n  .layout { grid-template-columns: 1fr; }\n  .sidenav { display: none; }\n  .diag, .ba, .g2, .g3, .g4 { grid-template-columns: 1fr; }\n  .elements, .elev { grid-template-columns: repeat(2, 1fr); }\n  section, .hero { padding-left: 24px; padding-right: 24px; }\n}\n<\u002Fstyle>\n\n<\u002Fhead>\n<body>\n<div class=\"layout\">\n\n  <!-- ─── Side navigation ─── -->\n  <nav class=\"sidenav\">\n    <div class=\"brand\"><div class=\"mark\">✦<\u002Fdiv><b>Alchm DS<\u002Fb><\u002Fdiv>\n    <a href=\"#fix\"><span class=\"dot\"><\u002Fspan>Root-cause fix<\u002Fa>\n    <div class=\"grp\">Foundations<\u002Fdiv>\n    <a href=\"#color\"><span class=\"dot\"><\u002Fspan>Color tokens<\u002Fa>\n    <a href=\"#elemental\"><span class=\"dot\"><\u002Fspan>Elemental<\u002Fa>\n    <a href=\"#aurora\"><span class=\"dot\"><\u002Fspan>Aurora &amp; nebula<\u002Fa>\n    <a href=\"#type\"><span class=\"dot\"><\u002Fspan>Typography<\u002Fa>\n    <a href=\"#scales\"><span class=\"dot\"><\u002Fspan>Scales<\u002Fa>\n    <div class=\"grp\">Components<\u002Fdiv>\n    <a href=\"#buttons\"><span class=\"dot\"><\u002Fspan>Buttons<\u002Fa>\n    <a href=\"#surfaces\"><span class=\"dot\"><\u002Fspan>Surfaces<\u002Fa>\n    <a href=\"#forms\"><span class=\"dot\"><\u002Fspan>Forms &amp; badges<\u002Fa>\n    <div class=\"grp\">Proof<\u002Fdiv>\n    <a href=\"#routes\"><span class=\"dot\"><\u002Fspan>Before / after<\u002Fa>\n    <a href=\"#changelog\"><span class=\"dot\"><\u002Fspan>Changelog<\u002Fa>\n  <\u002Fnav>\n\n  <main class=\"main\">\n\n    <!-- ─── Hero ─── -->\n    <header class=\"hero\">\n      <div class=\"kicker\">Planetary Agents · agents.alchm.kitchen<\u002Fdiv>\n      <h1>The <span class=\"aurora-text\">dark-first<\u002Fspan> token system.<\u002Fh1>\n      <p>One source of truth replacing three competing systems — shadcn tokens, global <code>.dark<\u002Fcode> overrides, and bespoke page CSS. Dark mode is applied at the root, color flows from semantic tokens, and the cosmic aesthetic is elevated with a restrained aurora accent layer.<\u002Fp>\n      <div class=\"meta\">\n        <span class=\"chip\"><span class=\"sw\" style=\"background:hsl(263 70% 58%)\"><\u002Fspan>Primary · violet<\u002Fspan>\n        <span class=\"chip\"><span class=\"sw\" style=\"background:var(--aurora)\"><\u002Fspan>Aurora accent<\u002Fspan>\n        <span class=\"chip\"><span class=\"sw\" style=\"background:#050410;border:1px solid #2a2550\"><\u002Fspan>Deep space bg<\u002Fspan>\n        <span class=\"chip\">WCAG AA · reduced-motion safe<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fheader>\n\n    <!-- ─── Root-cause fix ─── -->\n    <section id=\"fix\">\n      <div class=\"eyebrow\">Phase 1 · the bug<\u002Fdiv>\n      <h2 class=\"sec\">Dark pages, light tokens<\u002Fh2>\n      <p class=\"sec-lead\">Tokens were wired correctly, but <code>.dark<\u002Fcode> was never applied to the document — so every component resolved the <em>light<\u002Fem> token set on visually-dark pages. That's the white-on-white symptom. The fix is two moves: apply the theme at the root, and make the dark values the default so the bug can't recur.<\u002Fp>\n\n      <div class=\"diag\">\n        <div class=\"col bug\">\n          <h4><span class=\"tag\">SYMPTOM<\u002Fspan> What shipped<\u002Fh4>\n          <ul>\n            <li><code>app/layout.tsx<\u002Fcode> renders <b>&lt;html lang=\"en\"&gt;<\u002Fb> with no theme class.<\u002Fli>\n            <li><code>theme-provider.tsx<\u002Fcode> exists but is <b>never mounted<\u002Fb> in providers/layout.<\u002Fli>\n            <li>Components resolve <b>light tokens<\u002Fb> → white cards, near-white text on dark gradients.<\u002Fli>\n            <li>Bespoke <code>.dark [class*='bg-']<\u002Fcode> &amp; <code>.dark h1..p<\u002Fcode> overrides papered over it — and sat <b>dormant<\u002Fb> while <code>.dark<\u002Fcode> was unapplied.<\u002Fli>\n          <\u002Ful>\n<pre class=\"code\"><span class=\"c\">// app/layout.tsx — before<\u002Fspan>\n&lt;<span class=\"k\">html<\u002Fspan> <span class=\"a\">lang<\u002Fspan>=<span class=\"s\">\"en\"<\u002Fspan>&gt;\n  &lt;<span class=\"k\">body<\u002Fspan>&gt;{children}&lt;/<span class=\"k\">body<\u002Fspan>&gt;\n&lt;/<span class=\"k\">html<\u002Fspan>&gt;\n<span class=\"del\">// → .dark never present → light token set wins<\u002Fspan><\u002Fpre>\n        <\u002Fdiv>\n\n        <div class=\"col fix\">\n          <h4><span class=\"tag\">FIX<\u002Fspan> Theme at the root<\u002Fh4>\n          <ul>\n            <li>Confirm <code>darkMode: 'class'<\u002Fcode> in <b>tailwind.config.ts<\u002Fb> (already set).<\u002Fli>\n            <li>Add <b>className=\"dark\"<\u002Fb> at the root <em>and<\u002Fem> define dark values on <code>:root<\u002Fcode> in <code>tokens.css<\u002Fcode> — defense in depth.<\u002Fli>\n            <li>Optionally mount next-themes with <code>defaultTheme=\"dark\" enableSystem={false}<\u002Fcode> to keep <code>dark:<\u002Fcode> utilities authoring-correct.<\u002Fli>\n            <li>Now foreground/surface flow from tokens; blanket overrides can be <b>deleted<\u002Fb> (Phase 2).<\u002Fli>\n          <\u002Ful>\n<pre class=\"code\"><span class=\"c\">// app/layout.tsx — after<\u002Fspan>\n&lt;<span class=\"k\">html<\u002Fspan> <span class=\"a\">lang<\u002Fspan>=<span class=\"s\">\"en\"<\u002Fspan> <span class=\"add\">className=\"dark\"<\u002Fspan> <span class=\"add\">suppressHydrationWarning<\u002Fspan>&gt;\n  &lt;<span class=\"k\">body<\u002Fspan>&gt;{children}&lt;/<span class=\"k\">body<\u002Fspan>&gt;\n&lt;/<span class=\"k\">html<\u002Fspan>&gt;\n<span class=\"add\">// + tokens.css sets dark values on :root too<\u002Fspan><\u002Fpre>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <h3 class=\"sub\"><span class=\"n\">Phase 2<\u002Fspan> Blanket overrides removed<\u002Fh3>\n      <div class=\"grid g2\">\n        <div class=\"card\" style=\"padding:18px\">\n<pre class=\"code\" style=\"margin:0\"><span class=\"del\">/* DELETED — fought Tailwind, dormant */<\u002Fspan>\n<span class=\"del\">.dark [class*='bg-']:not(.bg-transparent)<\u002Fspan>\n<span class=\"del\">     :not(.bg-gradient-) { background: linear… }<\u002Fspan>\n<span class=\"del\">.dark h1,h2,p,span,div { color: rgb(243…) }<\u002Fspan><\u002Fpre>\n        <\u002Fdiv>\n        <div class=\"card\" style=\"padding:18px\">\n<pre class=\"code\" style=\"margin:0\"><span class=\"c\">/* REPLACED — explicit, intentional */<\u002Fspan>\n<span class=\"k\">.surface<\u002Fspan> { background: <span class=\"a\">linear-gradient<\u002Fspan>(135deg,\n   hsl(var(--card)/.92), hsl(var(--card)/.72));\n   border: 1px solid hsl(var(--border)/.7); }\n<span class=\"c\">/* foreground now flows from --foreground */<\u002Fspan><\u002Fpre>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ─── Color tokens ─── -->\n    <section id=\"color\">\n      <div class=\"eyebrow\">Phase 0 · foundations<\u002Fdiv>\n      <h2 class=\"sec\">Semantic color tokens<\u002Fh2>\n      <p class=\"sec-lead\">Every value is an HSL channel triplet consumed as <code>hsl(var(--token))<\u002Fcode> by <code>tailwind.config.ts<\u002Fcode> — so <code>bg-card<\u002Fcode>, <code>text-muted-foreground<\u002Fcode>, <code>border-border<\u002Fcode> all map straight through. Defined once, dark-first.<\u002Fp>\n      <div class=\"swatches\" id=\"swatchGrid\"><\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ─── Elemental ─── -->\n    <section id=\"elemental\">\n      <div class=\"eyebrow\">First-class subsystem<\u002Fdiv>\n      <h2 class=\"sec\">Elemental system<\u002Fh2>\n      <p class=\"sec-lead\">Fire · Water · Earth · Air drive agent chrome, chart glyphs, and ESMS telemetry. Each ships with a solid hue and a <code>-soft<\u002Fcode> translucent fill for backgrounds and tags.<\u002Fp>\n      <div class=\"elements\">\n        <div class=\"el\" style=\"background:var(--fire-soft)\"><div class=\"glyph\" style=\"color:var(--fire)\">△<\u002Fdiv><div class=\"lbl\">Fire<\u002Fdiv><div class=\"hex\">--fire · #ef5d4e<\u002Fdiv><\u002Fdiv>\n        <div class=\"el\" style=\"background:var(--water-soft)\"><div class=\"glyph\" style=\"color:var(--water)\">▽<\u002Fdiv><div class=\"lbl\">Water<\u002Fdiv><div class=\"hex\">--water · #5e9bd6<\u002Fdiv><\u002Fdiv>\n        <div class=\"el\" style=\"background:var(--earth-soft)\"><div class=\"glyph\" style=\"color:var(--earth)\">▢<\u002Fdiv><div class=\"lbl\">Earth<\u002Fdiv><div class=\"hex\">--earth · #8aa56a<\u002Fdiv><\u002Fdiv>\n        <div class=\"el\" style=\"background:var(--air-soft)\"><div class=\"glyph\" style=\"color:var(--air)\">○<\u002Fdiv><div class=\"lbl\">Air<\u002Fdiv><div class=\"hex\">--air · #d9c87a<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ─── Aurora ─── -->\n    <section id=\"aurora\">\n      <div class=\"eyebrow\">Accent layer<\u002Fdiv>\n      <h2 class=\"sec\">Aurora &amp; nebula<\u002Fh2>\n      <p class=\"sec-lead\">A single aurora gradient — violet → rose → gold — used as a signature on hero type, key CTAs, and the masked ring utility. The nebula radial set is the ambient page backdrop, token-aware and motion-safe.<\u002Fp>\n      <div class=\"aurora-banner\"><span>viriditas in motion<\u002Fspan><\u002Fdiv>\n      <div class=\"grid g3\" style=\"margin-top:16px\">\n        <div class=\"card\" style=\"padding:18px\"><div style=\"font-family:var(--ff-mono);font-size:11px;color:hsl(var(--muted-foreground))\">.aurora-text<\u002Fdiv><div class=\"aurora-text\" style=\"font-family:var(--ff-display);font-size:28px;margin-top:8px\">Transmute<\u002Fdiv><\u002Fdiv>\n        <div class=\"card aurora-ring\" style=\"padding:18px\"><div style=\"font-family:var(--ff-mono);font-size:11px;color:hsl(var(--muted-foreground))\">.aurora-ring<\u002Fdiv><div style=\"margin-top:8px;color:hsl(var(--foreground))\">Masked gradient border<\u002Fdiv><\u002Fdiv>\n        <div class=\"card\" style=\"padding:0;overflow:hidden\"><div style=\"height:100%;min-height:88px;background:var(--aurora-soft);display:grid;place-items:center;font-family:var(--ff-mono);font-size:11px;color:hsl(var(--foreground))\">--aurora-soft<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ─── Typography ─── -->\n    <section id=\"type\">\n      <div class=\"eyebrow\">Foundations<\u002Fdiv>\n      <h2 class=\"sec\">Typography &amp; fluid scale<\u002Fh2>\n      <p class=\"sec-lead\">Cormorant Garamond for display, Manrope for UI, IBM Plex Mono for telemetry. Display sizes are fluid — <code>clamp()<\u002Fcode> against viewport width — so headings scale without breakpoints.<\u002Fp>\n      <div style=\"margin-top:18px\">\n        <div class=\"typerow\"><div class=\"meta\">--text-3xl · display<\u002Fdiv><div class=\"spec\" style=\"font-size:var(--text-3xl)\">Council of Seven<\u002Fdiv><\u002Fdiv>\n        <div class=\"typerow\"><div class=\"meta\">--text-2xl · display<\u002Fdiv><div class=\"spec\" style=\"font-size:var(--text-2xl)\">Planetary hours<\u002Fdiv><\u002Fdiv>\n        <div class=\"typerow\"><div class=\"meta\">--text-xl · display<\u002Fdiv><div class=\"spec\" style=\"font-size:var(--text-xl)\">Elemental balance<\u002Fdiv><\u002Fdiv>\n        <div class=\"typerow\"><div class=\"meta\">--text-md · UI<\u002Fdiv><div class=\"spec\" style=\"font-size:var(--text-md);font-family:var(--ff-ui)\">The mind leads; depth runs beneath.<\u002Fdiv><\u002Fdiv>\n        <div class=\"typerow\"><div class=\"meta\">--text-sm · mono<\u002Fdiv><div class=\"spec\" style=\"font-size:var(--text-sm);font-family:var(--ff-mono);color:hsl(var(--muted-foreground))\">ESMS · KALCHM 4.12 · MONICA 5.30<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ─── Scales ─── -->\n    <section id=\"scales\">\n      <div class=\"eyebrow\">Foundations<\u002Fdiv>\n      <h2 class=\"sec\">Spacing · radius · elevation<\u002Fh2>\n      <h3 class=\"sub\">Spacing — 4px base<\u002Fh3>\n      <div id=\"spaceScale\"><\u002Fdiv>\n      <h3 class=\"sub\">Radius<\u002Fh3>\n      <div class=\"radii\">\n        <div class=\"r\" style=\"border-radius:var(--r-xs)\">--r-xs · 6<\u002Fdiv>\n        <div class=\"r\" style=\"border-radius:var(--r-sm)\">--r-sm · 8<\u002Fdiv>\n        <div class=\"r\" style=\"border-radius:var(--r-md)\">--r-md · 10<\u002Fdiv>\n        <div class=\"r\" style=\"border-radius:var(--r-lg)\">--r-lg · 14<\u002Fdiv>\n        <div class=\"r\" style=\"border-radius:var(--r-xl)\">--r-xl · 20<\u002Fdiv>\n      <\u002Fdiv>\n      <h3 class=\"sub\">Elevation<\u002Fh3>\n      <div class=\"elev\">\n        <div class=\"e\" style=\"box-shadow:var(--e-1)\">--e-1<\u002Fdiv>\n        <div class=\"e\" style=\"box-shadow:var(--e-2)\">--e-2<\u002Fdiv>\n        <div class=\"e\" style=\"box-shadow:var(--e-3)\">--e-3<\u002Fdiv>\n        <div class=\"e\" style=\"box-shadow:var(--e-glow)\">--e-glow<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ─── Buttons ─── -->\n    <section id=\"buttons\">\n      <div class=\"eyebrow\">Components<\u002Fdiv>\n      <h2 class=\"sec\">Buttons<\u002Fh2>\n      <p class=\"sec-lead\">Every variant is token-derived — no per-button workarounds. The <code>outline<\u002Fcode> variant keeps its <code>bg-transparent<\u002Fcode> fix and reads correctly on any surface below.<\u002Fp>\n      <h3 class=\"sub\">Variants<\u002Fh3>\n      <div class=\"btnrow\">\n        <button class=\"btn btn-primary\">Primary<\u002Fbutton>\n        <button class=\"btn btn-aurora\">✦ Aurora CTA<\u002Fbutton>\n        <button class=\"btn btn-secondary\">Secondary<\u002Fbutton>\n        <button class=\"btn btn-outline\">Outline<\u002Fbutton>\n        <button class=\"btn btn-ghost\">Ghost<\u002Fbutton>\n        <button class=\"btn btn-destructive\">Destructive<\u002Fbutton>\n      <\u002Fdiv>\n      <h3 class=\"sub\">Outline &amp; ghost on three surfaces<\u002Fh3>\n      <div class=\"surfaces-demo\">\n        <div class=\"s s-bg\"><div class=\"t\">background<\u002Fdiv><div class=\"btnrow\"><button class=\"btn btn-outline\">Outline<\u002Fbutton><button class=\"btn btn-ghost\">Ghost<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n        <div class=\"s s-card\"><div class=\"t\">card<\u002Fdiv><div class=\"btnrow\"><button class=\"btn btn-outline\">Outline<\u002Fbutton><button class=\"btn btn-ghost\">Ghost<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n        <div class=\"s s-pop\"><div class=\"t\">popover<\u002Fdiv><div class=\"btnrow\"><button class=\"btn btn-outline\">Outline<\u002Fbutton><button class=\"btn btn-ghost\">Ghost<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ─── Surfaces ─── -->\n    <section id=\"surfaces\">\n      <div class=\"eyebrow\">Components<\u002Fdiv>\n      <h2 class=\"sec\">Surfaces &amp; elevation<\u002Fh2>\n      <p class=\"sec-lead\">The glass-card look is now an explicit treatment applied intentionally — not a blanket override on every <code>bg-*<\u002Fcode> element.<\u002Fp>\n      <div class=\"grid g3\">\n        <div class=\"card\" style=\"padding:22px\"><div style=\"font-family:var(--ff-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:hsl(var(--muted-foreground))\">.surface<\u002Fdiv><h3 style=\"font-family:var(--ff-display);font-size:21px;margin:10px 0 6px\">Raised card<\u002Fh3><p style=\"margin:0;color:hsl(var(--muted-foreground));font-size:13px\">Default layered surface with hairline border and elevation 2.<\u002Fp><\u002Fdiv>\n        <div class=\"card glass\" style=\"padding:22px\"><div style=\"font-family:var(--ff-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:hsl(var(--muted-foreground))\">.glass<\u002Fdiv><h3 style=\"font-family:var(--ff-display);font-size:21px;margin:10px 0 6px\">Glass overlay<\u002Fh3><p style=\"margin:0;color:hsl(var(--muted-foreground));font-size:13px\">Restrained blur for sticky bars and modals.<\u002Fp><\u002Fdiv>\n        <div class=\"card aurora-ring\" style=\"padding:22px\"><div style=\"font-family:var(--ff-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:hsl(var(--muted-foreground))\">.surface + ring<\u002Fdiv><h3 style=\"font-family:var(--ff-display);font-size:21px;margin:10px 0 6px\">Featured<\u002Fh3><p style=\"margin:0;color:hsl(var(--muted-foreground));font-size:13px\">Aurora ring marks a primary or active panel.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ─── Forms & badges ─── -->\n    <section id=\"forms\">\n      <div class=\"eyebrow\">Components<\u002Fdiv>\n      <h2 class=\"sec\">Forms &amp; badges<\u002Fh2>\n      <p class=\"sec-lead\">Inputs keep a solid <code>--input<\u002Fcode> fill — never transparent — so they stay legible on dark. Focus uses the accent ring.<\u002Fp>\n      <div class=\"grid g2\">\n        <div class=\"card\" style=\"padding:24px\">\n          <div class=\"field\"><label>Birth date<\u002Flabel><input class=\"input\" value=\"1990-06-01\"><\u002Fdiv>\n          <div class=\"field\"><label>Location<\u002Flabel><input class=\"input\" placeholder=\"Brooklyn, NY\"><\u002Fdiv>\n          <div class=\"field\"><label>House system<\u002Flabel><input class=\"input\" value=\"Placidus\"><\u002Fdiv>\n          <button class=\"btn btn-aurora\" style=\"margin-top:4px\">✦ Generate context card<\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"card\" style=\"padding:24px\">\n          <h3 class=\"sub\" style=\"margin-top:0\"><span class=\"n\">badges<\u002Fspan> Status &amp; tags<\u002Fh3>\n          <div class=\"btnrow\" style=\"margin-bottom:18px\">\n            <span class=\"badge badge-default\">draft<\u002Fspan>\n            <span class=\"badge badge-success\">● activated<\u002Fspan>\n            <span class=\"badge badge-warning\">cooldown<\u002Fspan>\n            <span class=\"badge badge-danger\">retrograde<\u002Fspan>\n          <\u002Fdiv>\n          <h3 class=\"sub\">Elemental tags<\u002Fh3>\n          <div class=\"btnrow\">\n            <span class=\"badge\" style=\"background:var(--fire-soft);color:var(--fire)\">△ Fire 0.30<\u002Fspan>\n            <span class=\"badge\" style=\"background:var(--water-soft);color:var(--water)\">▽ Water 0.28<\u002Fspan>\n            <span class=\"badge\" style=\"background:var(--earth-soft);color:var(--earth)\">▢ Earth 0.22<\u002Fspan>\n            <span class=\"badge\" style=\"background:var(--air-soft);color:var(--air)\">○ Air 0.20<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ─── Before / after routes ─── -->\n    <section id=\"routes\">\n      <div class=\"eyebrow\">Proof · validation walk<\u002Fdiv>\n      <h2 class=\"sec\">Before / after — by route<\u002Fh2>\n      <p class=\"sec-lead\">The <b>before<\u002Fb> panel applies the <em>light<\u002Fem> shadcn token set to a dark-intent page — the exact state that ships when <code>.dark<\u002Fcode> is missing. Switch routes to inspect the white-on-white cards, invisible outline-button labels, and washed inputs the fix resolves.<\u002Fp>\n      <div class=\"tabs\" id=\"routeTabs\">\n        <button class=\"tab on\" data-route=\"landing\">Landing /<\u002Fbutton>\n        <button class=\"tab\" data-route=\"gallery\">Gallery<\u002Fbutton>\n        <button class=\"tab\" data-route=\"me\">Me / profile<\u002Fbutton>\n        <button class=\"tab\" data-route=\"account\">Account<\u002Fbutton>\n        <button class=\"tab\" data-route=\"auth\">Auth<\u002Fbutton>\n        <button class=\"tab\" data-route=\"admin\">Admin<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"ba\">\n        <div class=\"ba-col ba-before\">\n          <div class=\"ba-head\"><span class=\"t\">Before<\u002Fspan><span class=\"tag\">light tokens · .dark unapplied<\u002Fspan><\u002Fdiv>\n          <div class=\"viewport sim-light\">\n            <div class=\"bar\"><i style=\"background:#ff5f57\"><\u002Fi><i style=\"background:#febc2e\"><\u002Fi><i style=\"background:#28c840\"><\u002Fi><\u002Fdiv>\n            <div class=\"stage\"><div class=\"page-dark\" id=\"beforeStage\"><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"note\" id=\"beforeNote\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ba-col ba-after\">\n          <div class=\"ba-head\"><span class=\"t\">After<\u002Fspan><span class=\"tag\">unified dark tokens<\u002Fspan><\u002Fdiv>\n          <div class=\"viewport sim-dark\">\n            <div class=\"bar\"><i style=\"background:#ff5f57\"><\u002Fi><i style=\"background:#febc2e\"><\u002Fi><i style=\"background:#28c840\"><\u002Fi><\u002Fdiv>\n            <div class=\"stage\" id=\"afterStage\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"note\" id=\"afterNote\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ─── Changelog ─── -->\n    <section id=\"changelog\">\n      <div class=\"eyebrow\">Deliverable<\u002Fdiv>\n      <h2 class=\"sec\">What changed<\u002Fh2>\n      <div class=\"changelog\">\n        <div class=\"cl\"><div class=\"ph\">Phase 0<\u002Fdiv><div class=\"what\"><b>Token design.<\u002Fb> Inventoried bespoke CSS; defined semantic tokens + spacing/radius/elevation/fluid-type scales in <code>tokens.css<\u002Fcode>, consumed by tailwind.config.<\u002Fdiv><\u002Fdiv>\n        <div class=\"cl\"><div class=\"ph\">Phase 1<\u002Fdiv><div class=\"what\"><b>Dark mode at root.<\u002Fb> <code>&lt;html className=\"dark\"&gt;<\u002Fcode> + dark values on <code>:root<\u002Fcode> so the fallback is correct. <code>darkMode:'class'<\u002Fcode> confirmed.<\u002Fdiv><\u002Fdiv>\n        <div class=\"cl\"><div class=\"ph\">Phase 2<\u002Fdiv><div class=\"what\"><b>Blanket overrides deleted.<\u002Fb> Removed <code>.dark [class*='bg-']<\u002Fcode> and <code>.dark h1..p<\u002Fcode> color forcing; glass-card reintroduced as explicit <code>.surface<\u002Fcode>.<\u002Fdiv><\u002Fdiv>\n        <div class=\"cl\"><div class=\"ph\">Phase 3<\u002Fdiv><div class=\"what\"><b>Bespoke CSS consolidated.<\u002Fb> <code>cosmic-theme.css<\u002Fcode>, route CSS, and large parts of <code>landing.css<\u002Fcode>/<code>navigation.css<\u002Fcode> fold into tokens + Tailwind; starfield/nebula kept but token-aware &amp; reduced-motion safe.<\u002Fdiv><\u002Fdiv>\n        <div class=\"cl\"><div class=\"ph\">Phase 4<\u002Fdiv><div class=\"what\"><b>Polish.<\u002Fb> <code>focus-visible<\u002Fcode> rings, AA contrast pass, dark scrollbars + selection, solid input fills, restrained micro-interactions.<\u002Fdiv><\u002Fdiv>\n        <div class=\"cl\"><div class=\"ph\">Follow-ups<\u002Fdiv><div class=\"what\">Verify the 525+ <code>variant=\"outline\"<\u002Fcode> usages in-browser; spot-check <code>bg-card<\u002Fcode> consumers; run <code>tsc --noEmit<\u002Fcode>, <code>lint<\u002Fcode>, <code>build<\u002Fcode> per phase.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <div class=\"foot\">Alchm · Planetary Agents design system — dark-first, token-driven. Drop <code>design-system/tokens.css<\u002Fcode> + <code>globals.css<\u002Fcode> into the repo's <code>@layer base<\u002Fcode>.<\u002Fdiv>\n  <\u002Fmain>\n<\u002Fdiv>\n\n<script src=\"4a2de26d-5a51-46c4-96c1-6de5a98e3639\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
