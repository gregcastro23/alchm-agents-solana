name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run linting
        run: bun run lint
      - name: Run type checking
        run: bun run typecheck
      - name: Reject fabricated Monica fallbacks
        run: bun run check:no-fabricated-monica
      - name: Enforce the canonical Kalchm engine
        run: bun run check:no-stray-kalchm
      # Run the Python gate as its own step too. check:no-stray-kalchm delegates to
      # it only after every TypeScript check has passed, so a TypeScript failure
      # would otherwise stop the Python runtime from being policed at all — and
      # an unpoliced second runtime is the exact defect this gate exists to catch.
      - name: Enforce the canonical Kalchm engine (Python runtime)
        if: '!cancelled()'
        run: python3 scripts/check_no_stray_kalchm_formula.py
      - name: Run Solana protocol unit and metadata tests
        run: bun run test:solana:unit
      # Until this step existed, `test:solana:unit` was CI's only vitest run and
      # its include is `test/solana/**`, so the whole `test/` suite — the API
      # authorization and session tests among it — never ran on a pull request.
      # `!cancelled()` so a Solana failure cannot stop it, for the same reason
      # the Python Kalchm gate above runs independently.
      - name: Run application test suite
        if: '!cancelled()'
        run: bunx vitest run test/
      # Independent of the test suite above, for the same reason the Python Kalchm
      # gate is independent of the TypeScript one: a failing test must not stop
      # the build from being checked, or a broken build hides behind a red test.
      - name: Build application
        if: '!cancelled()'
        run: bun run build
        env:
          AUTH_SECRET: ci-build-only-auth-secret
          # The crash log from the OOM this replaces reported a ceiling of
          # 4113.9 MB, so the default heap on this runner is ALREADY ~4 GB —
          # matching the 4096 that `typecheck` sets would have changed nothing.
          # 8192 is the first value that actually raises it, and an
          # ubuntu-latest runner has 16 GB to draw on.
          NODE_OPTIONS: --max-old-space-size=8192
      # `typecheck` above uses the root tsconfig, which excludes test/ and
      # scripts/; `test:solana:unit` runs vitest, which does not type-check; and
      # the solana-program job runs only cargo. So nothing in CI ran
      # tsconfig.solana.json, and 8 type errors in test/solana/ (PRs #38–#40)
      # reached main and stopped `bun run test:solana` at its first step.
      # Last and `!cancelled()`, so it neither skips nor is skipped by the gates above.
      - name: Type-check the Solana surface and its tests
        if: '!cancelled()'
        run: bun run typecheck:solana

  # Raw SQL is only proven legal by a real query planner. A mock accepts
  # anything, which is how lib/security/security-audit.ts shipped a statement
  # passing an IDENTIFIER as a bind parameter — something PostgreSQL can never
  # PREPARE (42P18), so the audit threw on every real run while nothing failed
  # in CI. This job PREPARE/DEALLOCATEs every statically extractable statement
  # against a throwaway server. It reports its own blind spots on every run;
  # read the NOT COVERED section rather than treating green as full coverage.
  sql-prepare-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sql_prepare_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Ephemeral service container, destroyed with the job. Never point these
      # at a real database: the next step WRITES schema into it.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sql_prepare_gate
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/sql_prepare_gate
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # `db push` is how this repo actually deploys schema. prisma/migrations/
      # is far behind schema.prisma, so `migrate deploy` would NOT reproduce the
      # real schema and the gate would then be preparing against a fiction.
      # `db push` also uses no shadow database — per CLAUDE.md a shadow database
      # URL must never be a real one, because Prisma RESETS it.
      # Kept as its own step so a schema failure is never read as a SQL failure.
      - name: Establish schema (prisma db push, as this repo deploys)
        run: bunx prisma db push --skip-generate --accept-data-loss
      - name: Reject raw SQL PostgreSQL cannot prepare
        run: bun run scripts/checkRawSqlPrepares.ts
        env:
          SQL_PREPARE_GATE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sql_prepare_gate

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      - name: Run linting
        run: |
          cd backend
          ruff check .
      - name: Run tests
        run: |
          cd backend
          pytest

  solana-program:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.79.0
      # The litesvm runtime suite executes the compiled SBF program against the
      # real Token-2022 binary rather than a re-implementation, so the .so has to
      # exist before `cargo test`. Those tests fail loudly when it is missing —
      # deliberately, because a suite that silently skips its only end-to-end
      # coverage is worse than one that is absent.
      - name: Install Solana toolchain
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v1.18.17/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      # Wrapped rather than a bare `cargo build-sbf`: the linker reports a
      # stack-frame overflow and still exits 0 with a .so that faults at runtime.
      # The wrapper turns that into a build failure, and CI is exactly where it
      # must not be skipped.
      - name: Build SBF program
        run: node scripts/build-solana-program.mjs --sbf-only
      - name: Run Anchor program Rust unit tests
        run: cargo test -p asol_program --lib
