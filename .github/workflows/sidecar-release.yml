name: Sidecar release (pa-mcp)

# Builds the PyInstaller-frozen pa-mcp MCP stdio sidecar for all four Tauri
# target triples. PyInstaller cannot cross-compile — its bootloader is
# platform-native and wheels must be resolved on the target OS — so each
# triple is built on its matching runner. This is "Path A" from
# src-tauri/bin/README.md: the durable way to keep Windows/Linux coverage
# current, since neither can be produced from the Apple-Silicon dev machine
# (scripts/build-sidecar.sh covers only the two macOS arches locally).
#
# Output: one artifact per triple, named pa-mcp-<triple> (with .exe on
# Windows). Download from the run and drop into src-tauri/bin/ for the
# desktop bundle. The binaries are gitignored build artifacts (see
# .gitignore), so CI is the canonical place they are produced for release.

on:
  push:
    tags: ['v*', 'sidecar-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pa-mcp:
    name: pa-mcp (${{ matrix.triple }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One broken target should not cancel the other three — each is an
      # independent platform artifact.
      fail-fast: false
      matrix:
        include:
          - os: macos-15 # Pinned Apple Silicon (arm64) runner
            triple: aarch64-apple-darwin
          - os: macos-15-intel # Explicit x86_64 runner label
            triple: x86_64-apple-darwin
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The SDK and its validation/transport dependencies are locked separately
      # from the much larger FastAPI/ML application environment.
      - name: Install build deps
        run: |
          python -m pip install --require-hashes -r backend/requirements-mcp.lock
          python -m pip install "pyinstaller==6.22.3"

      - name: Build pa-mcp
        working-directory: backend
        run: python -m PyInstaller pa-mcp.spec --noconfirm --clean

      # Interactive requests keep stdin open through each response: closing it
      # immediately cancels outstanding work in the official SDK.
      - name: Smoke test (legacy + modern protocols and typed tools)
        shell: python
        run: |
          import glob, os, subprocess, sys
          matches = glob.glob(os.path.join("backend", "dist", "pa-mcp*"))
          assert len(matches) == 1, f"expected one sidecar executable, found {matches}"
          subprocess.run([sys.executable, "backend/mcp_smoke.py", matches[0]], check=True, timeout=180)

      - name: Stage artifact with triple-suffixed name
        shell: bash
        run: |
          mkdir -p out
          if [[ "${{ matrix.triple }}" == *windows* ]]; then
            cp backend/dist/pa-mcp.exe "out/pa-mcp-${{ matrix.triple }}.exe"
          else
            cp backend/dist/pa-mcp "out/pa-mcp-${{ matrix.triple }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pa-mcp-${{ matrix.triple }}
          path: out/*
          if-no-files-found: error
