[workspace]
members = ["programs/asol_program"]
# Standalone crates with their own manifests (alchm-astro-core is vendored into Pentacles).
exclude = ["alchm-astro-core"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
