[package]
name = "asol_program"
version = "0.1.0"
description = "AlchmAgentsSolana (ASOL) ESMS and persona core"
edition = "2021"
rust-version = "1.75"

[lib]
crate-type = ["cdylib", "lib"]
name = "asol_program"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "=0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "=0.30.1", features = [
  "associated_token",
  "token_2022",
  "token_2022_extensions",
] }
sha2 = "0.10.8"
sha3 = "0.10.8"
unicode-normalization = "0.1.25"

[dev-dependencies]
# Runtime harness for the account-substitution / authorization boundary tests.
# 0.2.1 is the last litesvm line built on solana ~1.18; 0.3+ requires solana 2.0,
# which cannot coexist with anchor-lang 0.30.1's 1.18.26 tree.
litesvm = "=0.2.1"
solana-sdk = "~1.18"
