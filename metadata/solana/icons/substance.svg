<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#180424" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#09010E" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="air-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="mercurial-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D0FE" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#C084FC" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#581C87" stop-opacity="0"/>
    </linearGradient>
    <filter id="aether-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="96" fill="url(#bg-glow)"/>
  <rect width="504" height="504" x="4" y="4" rx="92" fill="none" stroke="#C084FC" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Mercurial Resonance Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#mercurial-ring)" stroke-width="2" stroke-dasharray="6 8" opacity="0.6"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#C084FC" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Alchemical Air Sigil (Upward Triangle with Horizontal Bar) -->
  <g filter="url(#aether-glow)">
    <!-- Outer Triangle -->
    <polygon points="256,92 416,396 96,396" fill="none" stroke="url(#air-grad)" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Horizontal Sublimation Bar -->
    <line x1="60" y1="276" x2="452" y2="276" stroke="url(#air-grad)" stroke-width="14" stroke-linecap="round"/>

    <!-- Inner Nested Aether Core -->
    <polygon points="256,160 376,380 136,380" fill="url(#air-grad)" fill-opacity="0.2" stroke="#F5D0FE" stroke-width="4" stroke-linejoin="round"/>

    <!-- Central Dialectic Vertex -->
    <circle cx="256" cy="276" r="28" fill="#C084FC" fill-opacity="0.25" stroke="#C084FC" stroke-width="3"/>
    <circle cx="256" cy="276" r="10" fill="#F5D0FE"/>
  </g>

  <!-- Cardinal Embellishments -->
  <circle cx="256" cy="92" r="6" fill="#F472B6"/>
  <circle cx="416" cy="396" r="6" fill="#7C3AED"/>
  <circle cx="96" cy="396" r="6" fill="#7C3AED"/>
  <circle cx="60" cy="276" r="5" fill="#C084FC"/>
  <circle cx="452" cy="276" r="5" fill="#C084FC"/>
</svg>
