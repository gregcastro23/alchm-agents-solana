<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#02101E" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#01060D" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="water-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00FFFF"/>
      <stop offset="50%" stop-color="#0099FF"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="lunar-tide" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F7FA" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#002171" stop-opacity="0"/>
    </linearGradient>
    <filter id="wave-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="96" fill="url(#bg-glow)"/>
  <rect width="504" height="504" x="4" y="4" rx="92" fill="none" stroke="#00FFFF" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Lunar Orbit Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#lunar-tide)" stroke-width="2" stroke-dasharray="6 8" opacity="0.6"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#00E5FF" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Alchemical Water Sigil (Downward Triangle) -->
  <g filter="url(#wave-glow)">
    <!-- Outer Triangle -->
    <polygon points="96,116 416,116 256,420" fill="none" stroke="url(#water-grad)" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Inner Nested Tide Core -->
    <polygon points="136,132 376,132 256,352" fill="url(#water-grad)" fill-opacity="0.2" stroke="#00FFFF" stroke-width="4" stroke-linejoin="round"/>

    <!-- Central Receptive Focus & Lunar Crescent Path -->
    <circle cx="256" cy="226" r="28" fill="#00FFFF" fill-opacity="0.25" stroke="#00FFFF" stroke-width="3"/>
    <circle cx="256" cy="226" r="10" fill="#E0F7FA"/>
    <line x1="256" y1="152" x2="256" y2="302" stroke="#E0F7FA" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8"/>
  </g>

  <!-- Cardinal Embellishments -->
  <circle cx="96" cy="116" r="6" fill="#00FFFF"/>
  <circle cx="416" cy="116" r="6" fill="#00FFFF"/>
  <circle cx="256" cy="420" r="6" fill="#0099FF"/>
</svg>
