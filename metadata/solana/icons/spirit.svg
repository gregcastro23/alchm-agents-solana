<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF4500" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#140602" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#080201" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="fire-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF1A00"/>
      <stop offset="50%" stop-color="#FF4500"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>
    <linearGradient id="solar-corona" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FF4500" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#800A00" stop-opacity="0"/>
    </linearGradient>
    <filter id="flame-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="96" fill="url(#bg-glow)"/>
  <rect width="504" height="504" x="4" y="4" rx="92" fill="none" stroke="#FF4500" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Solar Corona Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#solar-corona)" stroke-width="2" stroke-dasharray="6 8" opacity="0.6"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#FFD700" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Alchemical Fire Sigil (Upward Triangle) -->
  <g filter="url(#flame-glow)">
    <!-- Outer Triangle -->
    <polygon points="256,92 416,396 96,396" fill="none" stroke="url(#fire-grad)" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Inner Nested Flame Core -->
    <polygon points="256,160 376,380 136,380" fill="url(#fire-grad)" fill-opacity="0.2" stroke="#FFD700" stroke-width="4" stroke-linejoin="round"/>

    <!-- Central Projective Axis & Solar Focus -->
    <circle cx="256" cy="286" r="28" fill="#FFD700" fill-opacity="0.25" stroke="#FFD700" stroke-width="3"/>
    <circle cx="256" cy="286" r="10" fill="#FFE066"/>
    <line x1="256" y1="210" x2="256" y2="360" stroke="#FFE066" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8"/>
  </g>

  <!-- Cardinal Embellishments -->
  <circle cx="256" cy="92" r="6" fill="#FFD700"/>
  <circle cx="416" cy="396" r="6" fill="#FF4500"/>
  <circle cx="96" cy="396" r="6" fill="#FF4500"/>
</svg>
